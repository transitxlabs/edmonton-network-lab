name: Offline fixture checks
on: [push, pull_request]
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m mypy src/network_lab
      - run: python -m pytest -q --basetemp=work-tmp/fixture-tests
      - name: Check frozen input hashes without network
        run: PYTHONPATH=src python scripts/verify_inputs.py
