[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "edmonton-network-lab"
version = "0.1.0"
description = "Reproducible scheduled transit access and service-deletion experiments"
requires-python = ">=3.14"
dependencies = ["numpy>=2", "scipy>=1.14", "shapely>=2", "pyproj>=3.6",
                "reportlab>=5", "pypdf>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.14"]

[project.scripts]
network-lab = "network_lab.query:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
